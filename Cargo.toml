[package]
name = "sse-taskbar"
version = "0.2.2"
edition = "2021"

[dependencies]
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Accessibility"] }
windows = { version = "0.62", features = ["Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Variant"] }

[profile.release]
lto = true
strip = true
opt-level = "s"
